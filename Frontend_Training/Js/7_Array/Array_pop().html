<!-- 👉 Removes the last item from an array.

Real-life Example:
Last passenger leaves the bus. -->
<!DOCTYPE html>
<html>
<body>
<h2>Array pop Example</h2>
<p id="demo"></p>

<script>

const fruits = ["Banana", "Orange", "Apple"];

// Remove last fruit
let fruit = fruits.pop();
console.log(typeof fruit);
console.log(typeof fruits);

document.getElementById("demo").innerHTML = 
"Removed fruit: " + fruit + "<br>Remaining fruits: " + fruits;


 
</script>
</body>
</html>
