<!-- 👉 Converts an array into a comma-separated string.

Real-life Example:
Like writing a shopping list on paper. -->
<!DOCTYPE html>
<html>
<body>
<h2>Array toString Example</h2>
<p id="demo"></p>

<script>
const fruits =["Banana", "Orange", "Apple", "Mango"];
document.write(fruits);
console.log(fruits);
console.log (typeof fruits);
// Convert to string
let myList = fruits.toString();

document.getElementById("demo").innerHTML =  myList;
console.log(myList);
console.log (typeof myList); 

</script>
</body>
</html>
