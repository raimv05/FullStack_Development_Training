<!-- 1. sort() – Sort Alphabetically

👉 Sorts array elements as strings (A → Z by default).
📌 Real Life Example: Sorting student names alphabetically.

Syntax: 

array.sort() -->

<!DOCTYPE html>
<html>
<body>
<h2>sort() Example</h2>
<p id="demo"></p>

<script>
const students = ["Riya", "Aman", "Sanjay", "Neha","Sanju"];
students.sort();  

document.getElementById("demo").innerHTML =
"Alphabetically Sorted Students: " + students;
</script>
</body>
</html>
