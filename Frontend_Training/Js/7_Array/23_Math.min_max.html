<!-- 7. Finding Min & Max

👉 No direct method → use tricks.

Using Math.min & Math.max: -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <p id="demo">Hi</p>

    <script>
        const num = [40,100,50,70,1,3,5,25,10];
        const x = Math.min.apply(null,num);
        const y = Math.max.apply(null,num);
        console.log(x,y);
        document.getElementById("demo").innerHTML = `Min: ${x} & Max: ${y}`;
    </script>
</body>
</html>
